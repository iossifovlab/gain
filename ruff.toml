exclude = [
    # Default values
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "_version.py",
    "versioneer.py",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # Custom values
    "old",
    "*tmp*",
    "*temp*",
    "data-hg19*",
    "docs",
    "migrations",
    "*.ipynb",
    "typings",
    # The mini-GRR fixture submodule (gain#991).  Its content is authored
    # upstream in iossifovlab/mini-GRR and pinned here, so gain cannot fix
    # what ruff reports in it -- and should not: it is a genomic resource
    # repository we validate, not source we maintain.
    #
    # Matched by name at any depth rather than at its one path.  A pinned
    # path is wrong twice over: git leaves the old working directory behind
    # when a submodule moves, so a build agent that checked this out before
    # gain#991 relocated it still has a full copy at the previous path and
    # `COPY core/` carries that copy into the CI image -- which is exactly
    # how this exclusion first went missing. What must never be linted is
    # mini-GRR's content, wherever a checkout happens to leave it.
    "**/mini-GRR",
]

line-length = 80
indent-width = 4

target-version = "py312"

[lint]
select = ["E", "F", "W", "C90", "I", "UP", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "T10", "EXE", "ISC", "LOG", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "ARG", "PTH", "FIX", "ERA", "PD", "TRY", "PERF", "FURB", "RUF"]
# Selectors are rule NAMES rather than codes: ruff 0.16 deprecated codes in
# selectors (`rule-codes-in-selectors`) and its own fix rewrote these.  The
# old code is kept in a trailing comment on each line so that grepping this
# file for "ASYNC109" -- or for a code quoted in an old commit or issue --
# still lands on the right row.  Category prefixes (PTH, SLF, D) have no
# name spelling and stay as they are.
ignore = [
    "undocumented-magic-method",           # D105
    "undocumented-public-init",            # D107
    "undocumented-param",                  # D417
    "redundant-open-modes",                # UP015
    "math-constant",                       # FURB152
    "raise-vanilla-args",                  # TRY003
    # for separate tasks, fix issues and then enable these rules
    "print",                               # T201
    "assert",                              # S101
    "PTH",
    # for separate task - currently we use 'csv', but maybe change to
    # 'tuple' or 'list'?
    "pytest-parametrize-names-wrong-type", # PT006
    # Python 3.11 introduces zero cost exception handling
    "try-except-in-loop",                  # PERF203
    "subprocess-without-shell-equals-true", # S603
    "suspicious-subprocess-import",        # S404
    "cached-instance-method",              # B019
    "sorted-min-max",                      # FURB192
    "suspicious-pickle-usage",             # S301
    # ASYNC109: our async `timeout` params are forwarded to the library that
    # owns the timeout (aiohttp.ClientTimeout, asyncio.wait_for, the Channels
    # test communicator) — asyncio.timeout() is not the right tool for them.
    "async-function-with-timeout",         # ASYNC109
]
fixable = ["ALL"]
preview = true

[lint.per-file-ignores]
# Test-only relaxations: fixtures pulled in for setup side-effects
# trip ARG001/ARG002; placeholder credentials trip S106/S107;
# `pytest.raises(...)` without `match=` trips PT011; one-line
# `assert a and b` trips PT018; bool positionals (FBT001/002) are
# fine in test helpers.
"test*.py" = [
    "assert",                              # S101
    "hardcoded-password-func-arg",         # S106
    "hardcoded-password-default",          # S107
    "SLF",
    "boolean-type-hint-positional-argument",    # FBT001
    "boolean-default-value-positional-argument", # FBT002
    "unused-function-argument",            # ARG001
    "unused-method-argument",              # ARG002
    "pytest-raises-too-broad",             # PT011
    "pytest-composite-assertion",          # PT018
    # RUF069, new in ruff 0.16's preview set.  These assertions compare an
    # annotator's output against the exact float written into the test's own
    # fixture -- 2.0, 330.0, 3.0.  Every such value is exactly representable
    # and travels through the pipeline unarithmetically, so `==` is the
    # assertion we want: a tolerance would let a real regression through.
    # The rule stays on for production code, where a computed float really
    # can drift.
    "float-equality-comparison",           # RUF069
]
"conftest.py" = [
    "D",
    "assert",                              # S101
    "hardcoded-password-func-arg",         # S106
    "hardcoded-password-default",          # S107
    "unused-function-argument",            # ARG001
    "unused-method-argument",              # ARG002
]
"setup.py" = ["implicit-namespace-package"]  # INP001
# RUF067 (`non-empty-init-module`), new in ruff 0.16's preview set, wants
# every `__init__.py` to hold nothing but docstrings and re-exports.  These
# four hold deliberate code and moving it is an API change, not a lint fix:
#
#   core/gain/__init__.py            the hatch-vcs `__version__` fallback and
#                                    the log-level side-effect import
#   spliceai_annotator/.../__init__  the `build_spliceai_annotator` factory
#                                    that the plugin entry point names
#   genomic_resources/__init__.py    re-exports plus module-level constants
#   genomic_resources/testing/__init__.py
#                                    816 lines of test-data builders that the
#                                    whole suite imports from this path
#
# Scoped to the four rather than ignored globally, so a NEW `__init__.py`
# that starts accumulating logic is still reported.  Revisiting them is
# tracked separately -- see the PR that introduced this block.
"core/gain/__init__.py" = ["non-empty-init-module"]                    # RUF067
"core/gain/genomic_resources/__init__.py" = ["non-empty-init-module"]  # RUF067
"core/gain/genomic_resources/testing/__init__.py" = ["non-empty-init-module"]  # RUF067
"spliceai_annotator/spliceai_annotator/__init__.py" = ["non-empty-init-module"]  # RUF067
# The fixture generator for the info_pages_e2e Playwright project: a
# standalone script in a Node project, run by hand and by that project's
# Dockerfile. It is deliberately not a package -- nothing imports it.
"info_pages_e2e/*.py" = ["implicit-namespace-package"]

[lint.mccabe]
max-complexity = 20

[lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"
multiline-quotes = "double"

[lint.pydocstyle]
convention = "pep257"
