# DELIBERATELY on the legacy `cnv_collection` spelling -- do NOT modernise
# this to `fragment_score`.
#
# The spelling is permanently accepted, because repositories we do not
# control may declare it at any time.  A fixture that still says it keeps
# the whole editor/resources API stack continuously proving that a legacy
# resource works -- through the real request path, not only in the tests
# written to check the aliases.
# `test_fragment_score_vocabulary_api` relies on this resource being the
# legacy spelling to prove the resource picker does not go blank.
type: cnv_collection
table:
    filename: data.txt
scores:
    - id: freq
      name: frequency
      type: float
      histogram:
        type: number
        number_of_bins: 3
        view_range:
          min: 0
          max: 1
        x_log_scale: false
        y_log_scale: true
      desc: some populaton frequency
    - id: collection
      name: collection
      type: str
      desc: col1 or col2
    - id: status
      name: affected_status
      type: str
      desc: |
        shows if the child that has the de novo
        is affected or unaffected
