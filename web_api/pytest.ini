[pytest]

junit_family=xunit1

# install pytest-cache and pytest-django
django_find_project = false

# Keep only the tmp_path dirs of failed tests, and drop the base dir of a
# green run. With the default policy `all`, the kept dirs of a full run
# filled the inodes of a tmpfs /tmp (gain#2169).
tmp_path_retention_policy = failed

DJANGO_SETTINGS_MODULE = web_annotation.test_settings
# addopts = -v
