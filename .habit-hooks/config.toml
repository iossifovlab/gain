# habit-hooks: coaching from the python and generic plugins. Run it from
# the repo root after `uv sync --package gain-core --group dev`.
plugins = ["python", "generic"]
# A snoozed finding comes back once a branch touches its file.
transformers = ["snooze-until-changed"]

[scope]
# Both default to "main"; gain's trunk is master.
branchBase = "master"
mainBranch = "master"
