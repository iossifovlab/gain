# Every service here is a LOCAL TEST FIXTURE, not a deployed service, so
# each one carries `org.seqpipe.ephemeral: "true"`.
#
# The seqpipe fleet commits a read-only node-state baseline
# (seqpipe/infra, state/nodes/*.yml) that captures the containers running
# on each host, so that `git diff` on it means "real drift". These
# fixtures run on the shared build agents -- the toolbox CLAUDE.md tells
# you to bring them up with `cd gain && docker compose up -d` -- so they
# appeared and disappeared in that baseline depending on who last ran
# tests on which agent. On 2026-08-27 piglet gained gain-apache-1 /
# gain-minio-1 / gain-mail-1 in the same re-baseline that pooh lost them.
#
# infra's node-state template drops any container labelled
# org.seqpipe.ephemeral=true. It filters on a LABEL rather than on a name
# prefix or on `restart: no`, because a label only ever excludes what
# someone deliberately marked: an unlabelled ad-hoc container is still
# captured, and a deployed service can never vanish from the baseline by
# accident. See seqpipe/infra#225 and iossifovlab/gain#956.
#
# Declared once as an anchor so the key has one place to change if infra
# ever renames it. Labels are metadata only -- no image, port, network or
# healthcheck changes here, so test behaviour is untouched.
x-ephemeral-fixture: &ephemeral-fixture
  org.seqpipe.ephemeral: "true"

services:

  minio:
    labels: *ephemeral-fixture
    # tb-eqh: pinned to a known-good release. Late-2023 MinIO removed
    # curl from the image (switched to ubi-micro), and `:latest` would
    # silently break the curl-based healthcheck on any agent that
    # pulled fresh. Pin so the image we test against matches what we
    # ship. Diagnosed in gpf where the symptom surfaced as a 27-test
    # S3 flake; gain has the same vulnerability and gets the same fix
    # defensively.
    # See: github.com/minio/minio/issues/18372 + /18389
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # Network-only by default — host-side port publishing lives in
    # docker-compose.override.yaml so parallel CI builds (multiple
    # `core` matrix cells, overlapping master CI runs) don't collide
    # on the same host ports. CI invokes compose with
    # `-f docker-compose.yaml` to skip the override.
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      # tb-eqh: switched from `curl http://localhost:9000/minio/health/live`
      # to `mc ready local`. The minio image has `mc` at /usr/bin/mc
      # and the `local` alias preconfigured to http://localhost:9000.
      # `mc ready` polls the cluster-readiness endpoint and exits 0
      # when ready; under docker's timeout=5s it gets killed and
      # reported unhealthy if not.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-client:
    labels: *ephemeral-fixture
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/test-bucket;  # Create bucket
      # /usr/bin/mc policy set public local/test-bucket;  # Make it public
      "
    depends_on:
      minio:
        condition: service_healthy


  apache:
    labels: *ephemeral-fixture
    image: httpd:latest
    # Network-only by default — host-side port publishing lives in
    # docker-compose.override.yaml. See note on `minio` above.
    expose:
      - "80"
    volumes:
      - ./core/tests/.test_grr:/usr/local/apache2/htdocs/

  mail:
    labels: *ephemeral-fixture
    image: axllent/mailpit:latest
    hostname: mail
    expose:
      - "1025"
      - "8025"
