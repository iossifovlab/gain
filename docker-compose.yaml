# Every service here is a LOCAL TEST FIXTURE, not a deployed service, so
# each one carries `org.seqpipe.ephemeral: "true"`.
#
# The seqpipe fleet commits a read-only node-state baseline
# (seqpipe/infra, state/nodes/*.yml) that captures the containers running
# on each host, so that `git diff` on it means "real drift". These
# fixtures run on the shared build agents -- the toolbox CLAUDE.md tells
# you to bring them up with `cd gain && docker compose up -d` -- so they
# appeared and disappeared in that baseline depending on who last ran
# tests on which agent. On 2026-08-27 piglet gained gain-apache-1 /
# gain-minio-1 / gain-mail-1 in the same re-baseline that pooh lost them.
#
# infra's node-state template drops any container labelled
# org.seqpipe.ephemeral=true. It filters on a LABEL rather than on a name
# prefix or on `restart: no`, because a label only ever excludes what
# someone deliberately marked: an unlabelled ad-hoc container is still
# captured, and a deployed service can never vanish from the baseline by
# accident. See seqpipe/infra#225 and iossifovlab/gain#956.
#
# Declared once as an anchor so the key has one place to change if infra
# ever renames it. Labels are metadata only -- no image, port, network or
# healthcheck changes here, so test behaviour is untouched.
x-ephemeral-fixture: &ephemeral-fixture
  org.seqpipe.ephemeral: "true"

# The S3 fixture server: RustFS, a maintained, Apache-2.0, S3-compatible
# server (gain#1708). Public on Docker Hub, so pulling needs no login.
# Pinned by the multi-arch (amd64 + arm64) index digest of the 1.0.0
# release, so every agent and workstation runs the same bytes.
#
# RustFS was chosen over SeaweedFS by running core/tests/small with
# --enable-s3-testing against both: the outcomes matched MinIO's test
# for test on each, but only RustFS keeps the tests that guard s3
# timestamp handling (gain#881, gain#1664) able to fail. Like MinIO, it
# reports LastModified to the millisecond in a listing and to the whole
# second on a HEAD, and those tests rely on that difference. SeaweedFS
# reports whole seconds on both, which leaves them passing whatever the
# code does. The spike numbers are on gain#1708.
x-s3-image: &s3-image rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff

services:

  s3:
    labels: *ephemeral-fixture
    image: *s3-image
    # Network-only by default — host-side port publishing lives in
    # docker-compose.override.yaml so parallel CI builds (multiple
    # `core` matrix cells, overlapping master CI runs) don't collide
    # on the same host ports. CI invokes compose with
    # `-f docker-compose.yaml` to skip the override.
    expose:
      - "9000"
      - "9001"
    environment:
      # The credentials every s3 test helper defaults to. gpf's fixture
      # uses the same pair, and gpf imports these helpers.
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # A test fixture has no business calling home.
      RUSTFS_CHECK_UPDATES: "false"
    healthcheck:
      # curl ships in the image; /health/live answers 200 once the
      # server takes requests.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null",
             "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-setup:
    labels: *ephemeral-fixture
    # One-shot: creates `test-bucket`, then exits. It reuses the server
    # image for its curl, whose --aws-sigv4 signs the S3 CreateBucket
    # request -- so no second image and no vendor client. Creating a
    # bucket that already exists answers 200, so re-running is harmless;
    # -f makes any other answer (a wrong secret is 403) fail the run.
    image: *s3-image
    entrypoint:
      - curl
      - -fsS
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - minioadmin:minioadmin
      - -X
      - PUT
      - http://s3:9000/test-bucket
    depends_on:
      s3:
        condition: service_healthy


  apache:
    labels: *ephemeral-fixture
    image: httpd:latest
    # Network-only by default — host-side port publishing lives in
    # docker-compose.override.yaml. See note on `s3` above.
    expose:
      - "80"
    volumes:
      - ./core/tests/.test_grr:/usr/local/apache2/htdocs/

  mail:
    labels: *ephemeral-fixture
    image: axllent/mailpit:latest
    hostname: mail
    expose:
      - "1025"
      - "8025"
