schema_version: 1

context:
  name: gain-vep-annotator
  version: ${{ env.get("VCS_VERSION") | default("0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # `uv build` writes a `.gitignore` with `*` into the dist dir; rattler-build
  # honours .gitignore by default and would skip every wheel/sdist, so we
  # opt out here.
  - path: ../../dist/vep_annotator
    use_gitignore: false
  - path: ../../LICENSE
  # The console-script + entry-point walk every gain recipe runs in its
  # test phase is defined once, beside the core recipe (#1433); pulling
  # that directory into the work dir is how this recipe's `tests:` gets
  # to copy the file in.
  - path: ../../core/conda-recipe/tests
    target_directory: tests

build:
  noarch: python
  number: 0
  script:
    interpreter: bash
    content: |
      set -euo pipefail
      "$PYTHON" -m pip install --no-deps --no-build-isolation -vv ./*.whl

requirements:
  host:
    - python >=3.12
    - pip
  run:
    - python >=3.12
    - gain-core

tests:
  # rattler-build's test phase installs the just-built package into a fresh
  # env solved from the run deps above. gain-core is not on conda-forge or
  # bioconda: Jenkinsfile.release offers the core recipe's output dir as
  # a channel so the gain-core built moments earlier is what resolves
  # here.
  # The walk runs every console script with --help and loads every gain.*
  # entry point this dist declares (see core/conda-recipe/tests/); the
  # top-level import and `pip check` share its environment rather than a
  # second test entry, because rattler-build installs one environment per
  # entry (#1600, rationale in the core recipe). `pip` is a test-only
  # requirement.
  #
  # CI builds this package in gain-vep-integration, with `--test skip`, and
  # runs these same checks from conda-builder/verify_packages.sh
  # instead (#1601, see the core recipe); change one, change the
  # other.
  - script:
      - python tests/entry_point_walk.py ${{ name }}
      - python -c "import vep_annotator"
      - pip check
    requirements:
      run:
        - pip
    files:
      source:
        - tests/entry_point_walk.py

about:
  homepage: https://github.com/IossifovLab/gain
  summary: GAIn VEP Annotator plugin
  license: MIT
  license_file: LICENSE
