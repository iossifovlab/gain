## Apache config for the web_ui production image.
##
## Replaces the supervisord-bound `web_ui/scripts/localhost.conf`
## from the pre-Phase-8 stack. Single foreground process via
## the `httpd:2.4-alpine` image's default `httpd-foreground`.
##
## Vhost: serves the Angular SPA from
## `/usr/local/apache2/htdocs/` (with SPA fallback to
## `index.html`), the Django admin / DRF static from
## `/usr/local/apache2/htdocs/static/`, and reverse-proxies
## `/api/` and `/ws/` to the daphne process on
## `backend:9001` (compose service name).

ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
User daemon
Group daemon

LoadModule mpm_event_module       modules/mod_mpm_event.so
LoadModule unixd_module           modules/mod_unixd.so
LoadModule authz_core_module      modules/mod_authz_core.so
LoadModule log_config_module      modules/mod_log_config.so
LoadModule mime_module            modules/mod_mime.so
LoadModule dir_module             modules/mod_dir.so
LoadModule alias_module           modules/mod_alias.so
LoadModule headers_module         modules/mod_headers.so
LoadModule filter_module          modules/mod_filter.so
LoadModule deflate_module         modules/mod_deflate.so
LoadModule expires_module         modules/mod_expires.so
LoadModule rewrite_module         modules/mod_rewrite.so
LoadModule remoteip_module        modules/mod_remoteip.so
LoadModule proxy_module           modules/mod_proxy.so
LoadModule proxy_http_module      modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module  modules/mod_proxy_wstunnel.so
LoadModule setenvif_module        modules/mod_setenvif.so

ErrorLog  /proc/self/fd/2

# `common` is NOT built in -- it is a nickname the stock httpd.conf defines,
# and Dockerfile.production replaces that file wholesale. CustomLog treats an
# undefined nickname as a literal format string, so naming one without
# defining it logged the word "common" once per request and nothing else,
# while `httpd -t` still reported Syntax OK (iossifovlab/gain#695).
#
# %{X-Forwarded-For}i is part of the format because %h is always this
# container's peer -- the upstream proxy, or the Docker bridge gateway when
# that proxy comes in over loopback -- and never the client. Without the
# header, no log this container writes can answer "which client made this
# request?", which is what made iossifovlab/gain#660 undiagnosable from logs.
#
# The account-confirmation and password-reset mails link to their endpoint
# with the single-use code in the query string, so %r -- the request line,
# query string included -- wrote a live code into this log, and so into the
# container's stdout, on every redemption (iossifovlab/gain#754). A reset
# code stays redeemable until the form is submitted or it ages out: a live
# credential at rest in a log, not a spent one.
#
# Such a request is logged through a format that keeps the path and drops
# the query; everything else keeps %r, because query strings are how the
# resource and search endpoints are diagnosed. The <redacted> literal is
# there so a reader can tell a withheld query from an absent one.
#
# The condition is on the QUERY, not on the two redemption paths: a path
# match is only as good as its spelling, and /api/rese%74_password carries
# the code past an anchored Request_URI match while daphne still decodes it
# back to the real route and redeems it. Matching wherever a code=
# parameter appears has no such gap and needs no list of endpoints kept in
# step with the Django side -- at the price of the query string of any
# request carrying a parameter named "code", which no endpoint does today.
# Adding one would silently lose its query from this log.
#
# This is only the log THIS container writes. The backend container's
# daphne writes the same codes to its own stdout (#795), and an upstream
# proxy keeps its own log; neither is reachable from here.
SetEnvIfExpr "%{QUERY_STRING} =~ /(^|&)code=/" code_bearing_query
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{X-Forwarded-For}i\"" proxied
LogFormat "%h %l %u %t \"%m %U?<redacted> %H\" %>s %b \"%{X-Forwarded-For}i\"" proxied_redacted
CustomLog /proc/self/fd/1 proxied          env=!code_bearing_query
CustomLog /proc/self/fd/1 proxied_redacted env=code_bearing_query
LogLevel  warn

TypesConfig conf/mime.types

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # SPA fallback: anything that isn't a real file or
    # directory under /, and isn't headed for /api/, /ws/, or
    # /static/, serves index.html so client-side routing works.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/ws/
    RewriteCond %{REQUEST_URI} !^/static/
    RewriteRule ^ /index.html [L]
</Directory>

# Django admin / DRF static — baked into the image at build
# time by the django-static stage.
Alias /static/ "/usr/local/apache2/htdocs/static/"
<Directory "/usr/local/apache2/htdocs/static/">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    ExpiresActive On
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, immutable"
</Directory>

# Long cache on hashed Angular assets, no-cache on
# index.html so a deploy is picked up immediately.
<Files "index.html">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
</Files>
<FilesMatch "\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$">
    ExpiresActive On
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, immutable"
</FilesMatch>

# Reverse-proxy /api/ to daphne.
#
# ProxyTimeout is set explicitly (iossifovlab/gain#492). Without it Apache
# inherits the 60s `Timeout` default, which is SHORTER than how long a client
# will wait: daphne runs every synchronous DRF view on one shared
# thread_sensitive executor thread (#150), so under load a request can be
# starved well past 60s and still complete. Apache would sever it mid-flight
# and hand the browser a 502 for a request that had not actually failed. In
# gain-web-e2e #1357 that turned a slow `POST /api/single_allele/annotate`
# into a hard error at exactly 60s.
#
# The value must stay BELOW the longest client-side wait (currently the 120s
# e2e waits in web_e2e). That ordering is deliberate and load-bearing: if the
# proxy outlives the client, a genuine stall produces no proxy error at all
# and the failure degrades into an opaque client timeout with nothing naming
# the cause -- the 502 is what made #1357 diagnosable. Keep
# 60 < ProxyTimeout < shortest client wait; raise both together or neither.
ProxyTimeout 90
ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}e"
ProxyPass        /api/ http://backend:9001/api/
ProxyPassReverse /api/ http://backend:9001/api/

# WebSockets via mod_proxy_wstunnel.
ProxyPass        /ws/ ws://backend:9001/ws/
ProxyPassReverse /ws/ ws://backend:9001/ws/

# Compression for text types.
AddOutputFilterByType DEFLATE \
    text/plain text/html text/css text/xml \
    application/javascript application/json image/svg+xml
