schema_version: 1

context:
  name: gain-core
  version: ${{ env.get("VCS_VERSION") | default("0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # `uv build` writes a `.gitignore` with `*` into the dist dir; rattler-build
  # honours .gitignore by default and would skip every wheel/sdist, so we
  # opt out here.
  - path: ../../dist/core
    use_gitignore: false
  - path: ../../LICENSE

build:
  noarch: python
  number: 0
  script:
    interpreter: bash
    content: |
      set -euo pipefail
      ls -la
      "$PYTHON" -m pip install --no-deps --no-build-isolation -vv ./*.whl

requirements:
  host:
    - python >=3.12
    - pip
  run:
    - python >=3.12
    - anndata >=0.13
    - apsw >=3.52
    - cerberus >=1.3
    # dask-core is the conda-forge package of PyPI's `dask`. Plain `dask`
    # there is a metapackage that also pulls in bokeh, pyarrow, lz4 and
    # cytoolz -- none of which gain imports. bokeh in particular registers
    # the level name TRACE for a number of its own on import, which
    # nothing in gain can undo (#1569); keep it out of a plain install.
    - dask-core >=2026.1
    - dask-jobqueue >=0.9
    - distributed >=2026.1
    - docker-py >=7.1
    - filelock >=3.19
    - fsspec >=2026.2
    - h5py >=3.11
    - intervaltree
    - jinja2 >=3.1
    - lark >=1.2
    - markdown2 >=2.4
    - matplotlib-base >=3.8
    - networkx >=3.6
    - numpy >=2.2
    - openpyxl >=3.1
    - pandas >=2.2
    - pathspec >=1.0
    - psutil
    - pybigwig >=0.3
    - pydantic >=2.8
    - pyliftover >=0.4
    - pysam >=0.24
    - python-box >=7.1
    - pyyaml >=6
    - s3fs >=2026.2
    - scipy >=1.14
    - tqdm >=4.66

tests:
  # rattler-build's own test phase: install the just-built package into a
  # fresh env solved from the run deps above (rattler-build needs
  # `-c conda-forge -c bioconda` for that -- pysam, pybigwig and pyliftover
  # live only on bioconda), then walk the whole surface the wheel declares.
  # The walk is tests/entry_point_walk.py, copied in from this recipe
  # directory and embedded in the package's tests. It is the one definition
  # for the whole repo: the three annotator recipes pull this directory in
  # as a source and run the same file for their own dist (#1433), and
  # gain-release's post-publish smoke runs it against the package as
  # installed from anaconda.org (#1432). Everything walked is discovered
  # from the installed dist's metadata, so a script or plugin added to
  # core/pyproject.toml is covered without touching this recipe. A run dep
  # missing from the list above surfaces as an ImportError.
  #
  # The walk never imports the run deps that only a lazy or engine-style
  # import reaches (openpyxl, docker, dask-jobqueue, s3fs); `pip check`
  # covers those by the wheel's Requires-Dist metadata. It runs here, in
  # the same environment as the walk, rather than as a second `python:`
  # test entry: rattler-build solves and installs a fresh environment per
  # test entry, so one entry is one install per package (#1600). The
  # script stops at the first failing command (rattler-build runs it under
  # `set -e`), so a walk failure is never masked by a passing `pip check`.
  # `pip` is a test-only requirement -- the `python:` test type used to add
  # it implicitly.
  #
  # These checks are defined in two places. This block runs wherever
  # rattler-build tests the package (Jenkinsfile.release, `rattler-build
  # test` on the .conda). The root Jenkinsfile builds with `--test skip`
  # and runs the same three checks from conda-builder/verify_packages.sh,
  # whose micromamba package cache persists on the agent (#1601). Change
  # one, change the other; the same goes for the three annotator recipes.
  - script:
      - python tests/entry_point_walk.py ${{ name }}
      - python -c "import gain"
      - pip check
    requirements:
      run:
        - pip
    files:
      recipe:
        - tests/entry_point_walk.py

about:
  homepage: https://github.com/IossifovLab/gain
  summary: GAIn — Genomic Annotation Infrastructure
  license: MIT
  license_file: LICENSE
