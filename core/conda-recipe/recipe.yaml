schema_version: 1

context:
  name: gain-core
  version: ${{ env.get("VCS_VERSION") | default("0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # `uv build` writes a `.gitignore` with `*` into the dist dir; rattler-build
  # honours .gitignore by default and would skip every wheel/sdist, so we
  # opt out here.
  - path: ../../dist/core
    use_gitignore: false
  - path: ../../LICENSE

build:
  noarch: python
  number: 0
  script:
    interpreter: bash
    content: |
      set -euo pipefail
      ls -la
      "$PYTHON" -m pip install --no-deps --no-build-isolation -vv ./*.whl

requirements:
  host:
    - python >=3.12
    - pip
  run:
    - python >=3.12
    - anndata >=0.13
    - apsw >=3.52
    - cerberus >=1.3
    - dask >=2026.1
    - dask-jobqueue >=0.9
    - distributed >=2026.1
    - docker-py >=7.1
    - filelock >=3.19
    - fsspec >=2026.2
    - h5py >=3.11
    - intervaltree
    - jinja2 >=3.1
    - lark >=1.2
    - markdown2 >=2.4
    - matplotlib-base >=3.8
    - networkx >=3.6
    - numpy >=2.2
    - openpyxl >=3.1
    - pandas >=2.2
    - pathspec >=1.0
    - psutil
    - pybigwig >=0.3
    - pydantic >=2.8
    - pyliftover >=0.4
    - pysam >=0.24
    - python-box >=7.1
    - pyyaml >=6
    - s3fs >=2026.2
    - scipy >=1.14
    - tqdm >=4.66

tests:
  # rattler-build's own test phase: install the just-built package into a
  # fresh env solved from the run deps above (rattler-build needs
  # `-c conda-forge -c bioconda` for that -- pysam, pybigwig and pyliftover
  # live only on bioconda), then walk the whole surface the wheel declares.
  # Everything walked is discovered from the installed dist's metadata, so
  # a script or plugin added to core/pyproject.toml is covered without
  # touching this recipe; only the `gain.` group prefix is known here.
  # A run dep missing from the list above surfaces as an ImportError.
  - script:
      interpreter: python
      content: |
        import subprocess
        import sys
        from importlib.metadata import distribution

        # Keep the per-item lines in order in a captured (non-tty) log.
        sys.stdout.reconfigure(line_buffering=True)

        entry_points = list(distribution("gain-core").entry_points)
        failures = []

        scripts = [e for e in entry_points if e.group == "console_scripts"]
        for ep in scripts:
            result = subprocess.run(
                [ep.name, "--help"], capture_output=True, text=True,
                check=False,
            )
            status = "ok" if result.returncode == 0 else "FAILED"
            print(f"console script {ep.name} --help: {status}")
            if result.returncode != 0:
                failures.append(
                    f"{ep.name} --help exited {result.returncode}:\n"
                    f"{result.stderr}")

        plugins = [e for e in entry_points if e.group.startswith("gain.")]
        for ep in plugins:
            try:
                ep.load()
                print(f"entry point {ep.group}:{ep.name}: ok")
            except Exception as exc:
                print(f"entry point {ep.group}:{ep.name}: FAILED")
                failures.append(f"{ep.group}:{ep.name}: {exc!r}")

        groups = sorted({e.group for e in plugins})
        print(
            f"walked {len(scripts)} console scripts and "
            f"{len(plugins)} entry points in {len(groups)} groups: "
            f"{', '.join(groups)}")
        assert scripts, "no console_scripts found in gain-core metadata"
        assert plugins, "no gain.* entry points found in gain-core metadata"
        if failures:
            print("\n\n".join(failures))
            sys.exit(1)

  # The walk never imports the run deps that only a lazy or engine-style
  # import reaches (openpyxl, docker, dask-jobqueue, s3fs); `pip check`
  # covers those by the wheel's Requires-Dist metadata.
  - python:
      imports:
        - gain
      pip_check: true

about:
  homepage: https://github.com/IossifovLab/gain
  summary: GAIn — Genomic Annotation Infrastructure
  license: MIT
  license_file: LICENSE
