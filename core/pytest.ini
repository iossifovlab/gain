[pytest]
# -p tests.dask_guard: the dask-ownership guard (#851); it registers its
# own `dask_executor` marker.
addopts = -p no:django -p tests.dask_guard --durations=20
# Hang diagnostic (#494). A test that stops making progress must end the
# run with a stack dump rather than silently consume the enclosing job's
# timeout. `faulthandler_timeout` arms faulthandler.dump_traceback_later
# around each item's *whole* protocol (setup + call + teardown) and dumps
# every thread's stack -- including background workers, which is the shape
# that matters (#480). `faulthandler_exit_on_timeout` (pytest >= 9) is what
# turns that dump into an exit; without it pytest dumps and keeps hanging.
# See docs/adr/0004-core-test-hang-diagnostic.md for why this and not
# pytest-timeout, whose dump is swallowed under `pytest -n`.
#
# 600s is ~76x the slowest legitimate item observed in CI (7.86s) and ~13x
# the worst seen under 32-way local parallelism (47.55s); it also clears a
# cold-cache tests/integration fixture that pulls the ~787MB hg19 genome,
# while still cutting a hang short well inside the 1h job timeout.
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
markers =
    grr_rw: mark test to run for RW protocols (s3, file, inmemory)
    grr_ro: mark test to run for RO protocols (http/https)
    grr_full: mark test to run for full RW protocols (s3, file)
    grr_http: mark test to run for http/https protocols
    grr_tabix: mark test to run for GRR protocols that support tabix (file, s3, http)
    legacy_vocabulary: mark test that deliberately configures a deprecated cnv_collection spelling and so may emit its deprecation notice (gain#538)
