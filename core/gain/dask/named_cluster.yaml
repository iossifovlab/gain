# The named clusters bundled with GAIn.
#
# `clusters` maps each named cluster to its cluster definition: the key is
# the name that `-N <name>` selects, and the value is the cluster definition.
# A cluster definition has no `name` key. A dask job name goes under `params`.
#
# dask merges a user file in the dask config directory (for example
# `~/.config/dask/`) over this file. An entry in the user file adds a named
# cluster, or overrides single keys of a bundled named cluster. See
# https://iossifovlab.com/gaindocs/named_clusters.html
gain_named_cluster:
  distributed:
    scheduler:
      unknown-task-duration: 10m
    worker:
      memory:
        pause: false

  default: local
  clusters:
    local_small:
      type: local
      params:
        memory_limit: 4GB
      # By default, the local cluster allocates as many workers as the
      # number of cores on the host. See the documentation of LocalCluster
      # for more information.
      # To set the number of workers, set:
      # number_of_workers: 10
      #
      # GAIn passes the params to the LocalCluster constructor. Some useful
      # params are given here. The LocalCluster documentation has the
      # complete description.
      # params:
      #   dashboard_address: :8898
    local:
      type: local
      params:
        memory_limit: 10GB
    local_large:
      type: local
      params:
        memory_limit: 16GB
    sge_small:
      type: sge
      number_of_workers: 10
      params:
        walltime: "24:00:00"
        scheduler_options:
          dashboard_address: :8898
        cores: 1
        memory: 2GB
        log_directory: ./.sge_worker_logs
        job_extra_directives:
        - "-V"
    sge:
      type: sge
      number_of_workers: 150
      params:
        scheduler_options:
          dashboard_address: :8898
        cores: 1
        memory: 4GB
        walltime: "72:00:00"
        log_directory: ./.sge_worker_logs
        job_extra_directives:
        - "-V"
        - "-l h_rss=4G"
        # - "-l h_vmem=4G"
    sge_large:
      type: sge
      # When a cluster definition holds both `number_of_workers` and
      # `adapt_params`, GAIn uses `number_of_workers`.
      adapt_params:
        minimum: 3
        maximum: 200
      params:
        scheduler_options:
          dashboard_address: :8898
        cores: 1
        memory: 8GB
        walltime: "72:00:00"
        log_directory: ./.sge_worker_logs
        job_extra_directives:
        - "-V"
        - "-l h_rss=8G"
        # - "-l h_vmem=8G"
    slurm:
      type: slurm
      number_of_threads: 10
      params:
        walltime: "48:00:00"
        cores: 1
        memory: 1GB
        log_directory: ./slurm_worker_logs
