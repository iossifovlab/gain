- name: check GAIn docs host
  hosts: all
  tasks:

  - name: debug
    debug:
      msg: "gain docs directory: {{ base_path }}/gaindocs"


- name: deploy gaindocs
  hosts: all

  vars:
    # Directory suffix for the release tree this deploy publishes. Must be
    # unique per deploy and usable as a path segment. CI passes
    # "<build number>-<short sha>" in through docs_deploy.sh; a bare local
    # run falls back to the docs host's clock so the script still works
    # with no arguments.
    docs_stamp: "{{ ansible_date_time.epoch }}"
    # How many release trees to keep, counting the one being published.
    docs_keep: 3

  tasks:

  # The site is swapped in by renaming a symlink -- never by emptying the
  # directory Apache serves. iossifovlab.com publishes the docs through a
  # fixed alias:
  #
  #     Alias /gaindocs /var/www/iossifovlab.com/gpf_documentation/gaindocs/html
  #
  # so `<base_path>/gaindocs/html` has to resolve at every instant. This
  # play used to remove that directory and unpack a fresh copy in its
  # place, which made every request during the unpack a 404 -- on every
  # master build, since Deploy docs lost its `changeset 'docs/**'` gate
  # (gain#1139, gain#1191). Apache has `Options FollowSymLinks` both for
  # /var/www/ and in the vhost's own <Directory> block, so serving the
  # site through a symlink needs no change to the Apache config.

  - name: ensure user docs directory exists
    file:
      path: "{{ base_path }}/gaindocs"
      state: directory

  # Staged under the deploy's own stamp. Two deploys landing at once would
  # otherwise share this path, and one could unarchive a tarball the other
  # had already replaced or cleaned up. The #1188 lock makes that unlikely
  # rather than impossible, and this play should not depend on it.
  #
  # Removed in `always`, because a per-deploy name means a failure between
  # the copy and the unarchive would strand 25MB on the docs host under a
  # name nothing ever looks at again -- the prune below sweeps release
  # directories, not tarballs.
  - name: stage and unpack the release
    block:

    - name: copy gaindocs-html.tar.gz
      copy:
        src: ../gaindocs-html.tar.gz
        dest: "{{ base_path }}/gaindocs-html-{{ docs_stamp }}.tar.gz"

    # Mode is explicit because --strip-components=1 drops the archive's own
    # `html/` member, and with it the mode the served directory used to
    # inherit from the tarball; it would otherwise come from the docs
    # host's umask. A restrictive umask there would 403 the whole site,
    # invisibly to this play.
    - name: create the release directory for this deploy
      file:
        path: "{{ base_path }}/gaindocs/html-{{ docs_stamp }}"
        state: directory
        mode: "0755"

    # build_docs.sh packs the site with `tar -C docs/build/ html/`, so every
    # member carries an `html/` prefix. Strip it, so the release directory
    # holds the site itself rather than a nested html/.
    - name: unarchive gaindocs-html.tar.gz into the release directory
      unarchive:
        src: "{{ base_path }}/gaindocs-html-{{ docs_stamp }}.tar.gz"
        dest: "{{ base_path }}/gaindocs/html-{{ docs_stamp }}"
        remote_src: true
        extra_opts:
          - --strip-components=1

    always:

    - name: clean gaindocs-html.tar.gz
      file:
        path: "{{ base_path }}/gaindocs-html-{{ docs_stamp }}.tar.gz"
        state: absent

  - name: check what the published path is now
    stat:
      path: "{{ base_path }}/gaindocs/html"
      follow: false
    register: gaindocs_published

  # One-time migration off the old layout, where `html` was a real
  # directory. It cannot be left to `force: true` on the link task: the
  # file module refuses outright to convert a non-empty directory into a
  # symlink, and while `path` is still a directory it resolves a relative
  # `src` against `path` itself -- so the link task would go looking for
  # `.../html/html-<stamp>` and fail.
  #
  # This is the one moment in the play when the published path does not
  # resolve. It lasts a single task transition and, with the #1188 stage
  # lock held, happens once ever -- on the first deploy after gain#1191.
  # Without that lock a second deploy could read `html` as a directory
  # here, then delete the symlink the first one had already published, so
  # the property is the pipeline's and not this play's alone.
  #
  # Renaming the old tree aside instead of deleting it was measured and is
  # not worth it: the gap is dominated by the transition to the next task,
  # not by the delete.
  - name: retire the pre-symlink docs directory
    file:
      path: "{{ base_path }}/gaindocs/html"
      state: absent
    when:
      - gaindocs_published.stat.exists
      - gaindocs_published.stat.isdir
      - not gaindocs_published.stat.islnk

  # The atomic swap. The file module publishes a link by creating it under
  # a temporary name in the same directory and rename()-ing that over the
  # target, so a reader sees either the whole previous release or the
  # whole new one.
  - name: publish the release
    file:
      path: "{{ base_path }}/gaindocs/html"
      src: "html-{{ docs_stamp }}"
      state: link

  - name: find the release directories
    find:
      paths: "{{ base_path }}/gaindocs"
      patterns: "html-*"
      file_type: directory
    register: gaindocs_releases

  # Keep the newest docs_keep releases. Every master build publishes ~40MB
  # and the nightly rebuild republishes unchanged docs, so without this the
  # docs host fills up.
  #
  # What keeps the live tree out of the sweep is its mtime rank, not the
  # name exclusion below: the release this run just published is the
  # newest and so never reaches the tail, and the name check only makes
  # that explicit. Keep docs_keep >= 2. At 1, a deploy racing this one
  # could prune the tree the other is about to publish, leaving `html`
  # dangling until the next deploy.
  - name: prune superseded releases
    file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ gaindocs_releases.files | sort(attribute='mtime', reverse=true) }}"
    loop_control:
      index_var: gaindocs_release_index
      label: "{{ item.path | basename }}"
    when:
      - gaindocs_release_index >= docs_keep | int
      - item.path | basename != 'html-' ~ docs_stamp
