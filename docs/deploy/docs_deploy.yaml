- name: check GAIn docs host
  hosts: all
  gather_facts: false
  tasks:

  - name: debug
    debug:
      msg: "gain docs directory: {{ base_path }}/gaindocs"


- name: deploy gaindocs
  hosts: all
  gather_facts: false

  vars:
    # How many release trees to keep, counting the one being published.
    # Keep this >= 2: at 1, a deploy racing this one could prune the tree
    # the other is about to publish, leaving `html` dangling.
    docs_keep: 3

  tasks:

  # The site is swapped in by renaming a symlink -- never by emptying the
  # directory Apache serves. iossifovlab.com publishes the docs through a
  # fixed alias:
  #
  #     Alias /gaindocs /var/www/iossifovlab.com/gpf_documentation/gaindocs/html
  #
  # so `<base_path>/gaindocs/html` has to resolve at every instant. This
  # play used to remove that directory and unpack a fresh copy in its
  # place, which made every request during the unpack a 404 -- on every
  # master build, since Deploy docs lost its `changeset 'docs/**'` gate
  # (gain#1139, gain#1191). Apache has `Options FollowSymLinks` both for
  # /var/www/ and in the vhost's own <Directory> block, so serving the
  # site through a symlink needs no change to the Apache config.

  # Names the release directory this deploy publishes, so what is live on
  # the docs host is traceable to the build that put it there. CI exports
  # DOCS_STAMP as "<build number>-<short sha>"; a hand-run deploy falls
  # back to the clock and needs no arguments. `-e docs_stamp=...` still
  # wins over both, as extra vars do.
  #
  # Pinned with set_fact rather than declared under `vars`: a play var is
  # re-templated at every reference, and the fallback shells out to `date`,
  # so each task used to see its own second -- the release was created
  # under one name and published under the next ("src file does not
  # exist"). CI's DOCS_STAMP never changes between tasks, which is why only
  # hand-run deploys hit it.
  - name: name the release this deploy publishes
    set_fact:
      docs_stamp: >-
        {{ lookup('env', 'DOCS_STAMP')
           or lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}

  # docs_stamp is interpolated into paths under base_path and is what the
  # prune below globs for, so a stray `/` or `*` would reach outside the
  # release namespace. The contract is cheap enough to check rather than
  # just document.
  - name: check the release stamp is a usable directory suffix
    assert:
      that: docs_stamp is match('^[A-Za-z0-9._-]+$')
      fail_msg: >-
        docs_stamp must be one path segment of letters, digits, dot,
        underscore or dash; got "{{ docs_stamp }}"
      quiet: true

  # Read before anything is written, so the decision below and the
  # migration branch further down both see the host as it was when this
  # deploy started. The #1188 stage lock is what makes that read stay true
  # until the flip: no other CI deploy runs in between.
  - name: check what the published path is now
    stat:
      path: "{{ base_path }}/gaindocs/html"
      follow: false
    register: gaindocs_published

  # Ordering guard (gain#1190). The lock serialises deploys but does not
  # order them: a fast docs-only build overtaking a slow full build (or
  # simply a shorter build queued later) publishes first, and the older
  # build then publishes last -- master #1061 did exactly that over #1062
  # on 2026-09-05, and the site served two-commits-stale docs until the
  # next build. The published symlink's target already carries the build
  # number that put it there, so compare and refuse to go backwards.
  #
  # Only CI stamps take part: "<build number>-<anything>", where the
  # number is a master build number and therefore monotonic in push order
  # (the nightly rebuild carries a higher number and the same content,
  # which is harmless). A hand-run deploy's timestamp stamp, a fresh host
  # with no symlink, and the pre-symlink `html` directory all fall
  # through to a normal publish: a hand-run deploy is a human decision and
  # always wins, and the CI deploy after it publishes too. Equal numbers
  # (a re-run of the same build) publish.
  - name: work out whether a newer master build is already published
    vars:
      published_release: >-
        {{ gaindocs_published.stat.lnk_target | default('') | basename }}
      published_build: >-
        {{ published_release | regex_replace('^html-([0-9]+)-.*$', '\1') }}
      this_build: >-
        {{ docs_stamp | regex_replace('^([0-9]+)-.*$', '\1') }}
    set_fact:
      docs_published_release: "{{ published_release }}"
      docs_superseded: >-
        {{ published_release is match('^html-[0-9]+-')
           and docs_stamp is match('^[0-9]+-')
           and (published_build | int) > (this_build | int) }}

  # A skipped publish is the intended outcome, not an error: the stage and
  # the build stay green, and this one line in the log says why nothing
  # changed. Stopping before the unpack also means there is no release
  # directory to clean up, so the prune's assumption below (the newest
  # release by mtime is the published one) still holds.
  - name: leave the newer build's release published
    debug:
      msg: >-
        Not publishing html-{{ docs_stamp }}: {{ inventory_hostname }}
        already serves {{ docs_published_release }}, from a newer master
        build. Nothing was changed; this build's docs are superseded.
    when: docs_superseded | bool

  - name: stop here when a newer build is published
    meta: end_play
    when: docs_superseded | bool

  # Creates `gaindocs` too, if the host has never been deployed to. Mode is
  # explicit because --strip-components=1 drops the archive's own `html/`
  # member, and with it the mode the served directory used to inherit from
  # the tarball; it would otherwise come from the docs host's umask, and a
  # restrictive umask there would 403 the whole site invisibly.
  - name: create the release directory for this deploy
    file:
      path: "{{ base_path }}/gaindocs/html-{{ docs_stamp }}"
      state: directory
      mode: "0755"

  # Local `src`, so unarchive stages the tarball through its own
  # per-invocation remote tmpdir and removes it on every exit path. Copying
  # it into base_path under a name of our own would mean two deploys could
  # collide on that path, and a failure between the copy and the unpack
  # would strand 25MB the prune below never looks at.
  #
  # build_docs.sh packs the site with `tar -C docs/build/ html/`, so every
  # member carries an `html/` prefix. Strip it, so the release directory
  # holds the site itself rather than a nested html/.
  - name: unarchive gaindocs-html.tar.gz into the release directory
    unarchive:
      src: ../gaindocs-html.tar.gz
      dest: "{{ base_path }}/gaindocs/html-{{ docs_stamp }}"
      extra_opts:
        - --strip-components=1

  # Converts the pre-symlink layout, where `html` was a real directory. It
  # cannot be left to `force: true` on the link task: the file module
  # refuses outright to turn a non-empty directory into a symlink, and
  # while `path` is still a directory it resolves a relative `src` against
  # `path` itself -- so the link task would look for `.../html/html-<stamp>`
  # and fail.
  #
  # `follow: false` makes stat report a symlink as islnk and not isdir, so
  # isdir alone distinguishes the old layout from the new one. The stat was
  # taken before the unpack above; nothing in between touches `html`.
  #
  # This is the one moment in the play when the published path does not
  # resolve, and it lasts a single task transition. It fires on the first
  # deploy after gain#1191 and then only on a host that somehow has the old
  # layout again -- a restore from a pre-1191 backup, say. It is not
  # self-disabling, so it stays. With the #1188 stage lock held that is the
  # whole story; without it, a second deploy could read `html` as a
  # directory here and then delete the symlink the first one published.
  #
  # Renaming the old tree aside instead of deleting it was measured and is
  # not worth it: the gap is dominated by the transition to the next task,
  # not by the delete.
  - name: retire the pre-symlink docs directory
    file:
      path: "{{ base_path }}/gaindocs/html"
      state: absent
    when: gaindocs_published.stat.isdir | default(false)

  # The atomic swap. The file module publishes a link by creating it under
  # a temporary name in the same directory and rename()-ing that over the
  # target, so a reader sees either the whole previous release or the
  # whole new one.
  - name: publish the release
    file:
      path: "{{ base_path }}/gaindocs/html"
      src: "html-{{ docs_stamp }}"
      state: link

  - name: find the release directories
    find:
      paths: "{{ base_path }}/gaindocs"
      patterns: "html-*"
      file_type: directory
    register: gaindocs_releases

  # Keep the newest docs_keep releases and delete the tail. Every master
  # build publishes ~40MB and the nightly rebuild republishes unchanged
  # docs, so without this the docs host fills up. The release just
  # published is the newest by mtime, so it is never in the tail.
  - name: prune superseded releases
    file:
      path: "{{ item }}"
      state: absent
    loop: >-
      {{ (gaindocs_releases.files | sort(attribute='mtime', reverse=true)
          | map(attribute='path') | list)[docs_keep | int:] }}
    loop_control:
      label: "{{ item | basename }}"
