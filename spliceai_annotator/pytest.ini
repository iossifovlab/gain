[pytest]
# Keep only the tmp_path dirs of failed tests, and drop the base dir of a
# green run. With the default policy `all`, the kept dirs of a full run
# filled the inodes of a tmpfs /tmp (gain#2169).
tmp_path_retention_policy = failed
markers =
    integration: slow tests (the differential harness against the frozen hg38 corpus) run by the gain-spliceai-integration downstream job, and excluded from the fast per-PR spliceai_annotator step (`-m "not integration"`).
