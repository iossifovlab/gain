[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gain-spliceai-annotator"
description = "GAIn SpliceAI annotator plugin"
requires-python = "<3.15,>=3.12"
license = { text = "MIT" }
authors = [
    { name = "Lubomir Chorbadjiev", email = "lubomir.chorbadjiev@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gain-core",
    "numpy>=2.2",
    # ONNX Runtime is the default model runtime (#299, ADR 0042), so it is
    # the one runtime every install carries. TensorFlow is the `tensorflow`
    # extra below: SPLICEAI_BACKEND=tensorflow without it fails at import,
    # naming the install (see spliceai_annotator_impl).
    # >=1.26 is a floor, not a ceiling: the conda recipe installs this wheel
    # with `pip install --no-deps`, so whatever bound is written here is baked
    # into that conda env as a Requires-Dist that `pip check` and
    # importlib.metadata enforce. Keep it in step with the recipe's own
    # bound. Nothing in this backend needs a newer release; the committed
    # uv.lock pins the exact version CI resolves.
    "onnxruntime>=1.26",
]

dynamic = ["version"]

[project.optional-dependencies]
# The TensorFlow/Keras backend: `pip install gain-spliceai-annotator[tensorflow]`.
# Kept for the .h5 source of truth and its equivalence tests; ~2 GB
# installed, and no Python 3.14 wheels (ADR 0042).
tensorflow = [
    "tensorflow>=2.18",
]

[project.urls]
Homepage = "https://github.com/IossifovLab/gain"

[project.entry-points."gain.annotation.annotators"]
spliceai_annotator = "spliceai_annotator:build_spliceai_annotator"

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pylint",
    "pylint-junit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "ruff==0.16.5",
    "types-pyyaml",
    # Build-time-only tooling for the offline .h5 -> .onnx conversion
    # (scripts/convert_models_to_onnx.py) and the equivalence test
    # (tests/test_onnx_equivalence.py). `onnx` provides onnx.checker;
    # `tf2onnx` is imported by Keras' model.export(format="onnx"). Neither is
    # needed to *run* the committed .onnx -- that is onnxruntime, which #297
    # promoted to a runtime dep above. The equivalence test skips cleanly when
    # these are absent.
    # Pinned: the committed .onnx artifacts were produced by these exact
    # versions, so a float must not silently redefine what "reproduces the
    # .h5" means without an intentional bump here. (onnxruntime carries a
    # lower bound instead, as an installed-at-runtime dep; the committed
    # uv.lock still pins the exact version CI resolves, and
    # tests/test_onnx_equivalence.py re-checks reproduction on every run.)
    "onnx==1.22.0",
    "tf2onnx==1.17.0",
]
# The PyTorch spike of #2425: `scripts/measure_torch_backend.py` ports one
# model to torch.nn and times it against ONNX Runtime and TensorFlow. Not a
# runtime dependency and not synced by CI. Install it with
# `uv sync --package gain-spliceai-annotator --group dev --group torch-spike`.
torch-spike = [
    "torch",
]

# A plain PyPI `torch` on Linux pulls in the CUDA stack as `nvidia-*`
# packages. The CPU index holds builds without them. The index is explicit,
# so `torch` is the only package that uv takes from it.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
root = ".."
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["spliceai_annotator"]

[tool.hatch.build.targets.sdist]
include = ["/spliceai_annotator"]

# The repository LICENSE sits one level up. The sdist copies it to its
# top level as a regular file, and the wheel, which uv builds from the
# unpacked sdist, picks it up there as a PEP 639 license file (#1961).
[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
