# This file may be used to create an environment using:
# $ conda env create --name <env> --file <this file>
# platform: linux-64
# conda create -c conda-forge -c bioconda -n <env name> --file <this file>

name: gain
channels:
  - conda-forge
  - bioconda
  - iossifovlab
dependencies:
  - coverage
  # >=9 for faulthandler_exit_on_timeout, which core/pytest.ini relies on
  # to turn a hung test into a failure instead of a silent stall (#494).
  - pytest>=9
  - pytest-cov
  - pytest-xdist
  - pytest-mock
  - pytest-django
  - pytest-doctestplus
  # Test-only: decodes the vendored woff2 fonts so the icon-font test
  # can read which glyphs the subset carries (#1400).
  - brotli
  - fonttools
  - ruff
  - pylint
  - mypy
  - flake8
  - mypy
  - pylint
  - pylint-django
  - pytest>=9
  - pytest-asyncio
  - pytest-cov
  - pytest-django
  - pytest-mock
  - pytest-xdist
  - ipython
  - curl
  - pip:
    - sphinx
    - sphinx_rtd_theme
    - sphinx-copybutton
    - sphinxcontrib-httpdomain
    - sphinx-autorun
    - sphinxcontrib-video
    - sphinx-last-updated-by-git
    - esbonio
    - doc8
    - rstcheck
    - types-requests-oauthlib
    - types-requests
    - types-channels
    - types-requests
    - types-psutil
    - pytestarch
    - myst-parser
    - sphinxcontrib-mermaid
  